services:
  - type: web
    name: allone-crm-mvp
    runtime: static
    staticPublishPath: .
    buildCommand: ""
    pullRequestPreviewsEnabled: false

    routes:
      # --- Canonicalize: old *.html URLs 301 to the clean path ---
      - type: redirect
        source: /index.html
        destination: /
        status: 301
      - type: redirect
        source: /crm.html
        destination: /crm
        status: 301
      - type: redirect
        source: /case-study-liam-education.html
        destination: /case-study-liam-education
        status: 301
      - type: redirect
        source: /case-study-aztravel.html
        destination: /case-study-aztravel
        status: 301
      - type: redirect
        source: /bang-gia.html
        destination: /bang-gia
        status: 301
      - type: redirect
        source: /tai-nguyen.html
        destination: /tai-nguyen
        status: 301
      - type: redirect
        source: /lien-he.html
        destination: /lien-he
        status: 301
      - type: redirect
        source: /free-trial.html
        destination: /dang-ky
        status: 301
      - type: redirect
        source: /free-trial
        destination: /dang-ky
        status: 301
      - type: redirect
        source: /dang-ky.html
        destination: /dang-ky
        status: 301
      - type: redirect
        source: /lms.html
        destination: /lms
        status: 301
      - type: redirect
        source: /omni.html
        destination: /omni
        status: 301
      - type: redirect
        source: /giai-phap-quan-tri-hop-nhat.html
        destination: /giai-phap-quan-tri-hop-nhat
        status: 301
      - type: redirect
        source: /giai-phap-ban-hang-khach-hang.html
        destination: /giai-phap-ban-hang-khach-hang
        status: 301
      - type: redirect
        source: /giai-phap-kho-chuoi-cung-ung.html
        destination: /giai-phap-kho-chuoi-cung-ung
        status: 301
      - type: redirect
        source: /giai-phap-dao-tao-hoc-tap.html
        destination: /giai-phap-dao-tao-hoc-tap
        status: 301
      - type: redirect
        source: /giai-phap-tu-dong-hoa-ai-agent.html
        destination: /giai-phap-tu-dong-hoa-ai-agent
        status: 301
      - type: redirect
        source: /giai-phap-cham-soc-da-kenh.html
        destination: /giai-phap-cham-soc-da-kenh
        status: 301
      - type: redirect
        source: /giai-phap-ung-dung-rieng.html
        destination: /giai-phap-ung-dung-rieng
        status: 301
      - type: redirect
        source: /giai-phap.html
        destination: /giai-phap
        status: 301

      # --- Serve the clean path from its backing .html file ---
      - type: rewrite
        source: /crm
        destination: /crm.html
      - type: rewrite
        source: /case-study-liam-education
        destination: /case-study-liam-education.html
      - type: rewrite
        source: /case-study-aztravel
        destination: /case-study-aztravel.html
      - type: rewrite
        source: /bang-gia
        destination: /bang-gia.html
      - type: rewrite
        source: /tai-nguyen
        destination: /tai-nguyen.html
      - type: rewrite
        source: /lien-he
        destination: /lien-he.html
      - type: rewrite
        source: /dang-ky
        destination: /dang-ky.html
      - type: rewrite
        source: /lms
        destination: /lms.html
      - type: rewrite
        source: /omni
        destination: /omni.html
      - type: rewrite
        source: /giai-phap-quan-tri-hop-nhat
        destination: /giai-phap-quan-tri-hop-nhat.html
      - type: rewrite
        source: /giai-phap-ban-hang-khach-hang
        destination: /giai-phap-ban-hang-khach-hang.html
      - type: rewrite
        source: /giai-phap-kho-chuoi-cung-ung
        destination: /giai-phap-kho-chuoi-cung-ung.html
      - type: rewrite
        source: /giai-phap-dao-tao-hoc-tap
        destination: /giai-phap-dao-tao-hoc-tap.html
      - type: rewrite
        source: /giai-phap-tu-dong-hoa-ai-agent
        destination: /giai-phap-tu-dong-hoa-ai-agent.html
      - type: rewrite
        source: /giai-phap-cham-soc-da-kenh
        destination: /giai-phap-cham-soc-da-kenh.html
      - type: rewrite
        source: /giai-phap-ung-dung-rieng
        destination: /giai-phap-ung-dung-rieng.html
      - type: rewrite
        source: /giai-phap
        destination: /giai-phap.html

    headers:
      # --- Security headers, applied to every response ---
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), microphone=(), camera=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      # connect-src allows Web3Forms — the form-to-email relay js/config.js posts to.
      # If that's ever swapped for a different endpoint, update this to match.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.web3forms.com; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

      # --- HTML documents: revalidate on every request so content edits go live immediately ---
      - path: /*
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"

      # --- CSS/JS are query-string versioned (see ?v=N in the HTML) so it's safe to cache them for a year ---
      - path: /css/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /js/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
