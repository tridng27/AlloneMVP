    headers:
      # --- Security headers, applied to every response ---
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), microphone=(), camera=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      # connect-src allows Web3Forms — the form-to-email relay js/config.js posts to.
      # If that's ever swapped for a different endpoint, update this to match.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://sp.zalo.me; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.zalo.me https://*.zdn.vn; connect-src 'self' https://api.web3forms.com https://sp.zalo.me; frame-src https://page.widget.zalo.me; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

      # --- HTML documents: revalidate on every request so content edits go live immediately ---
      - path: /*
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"

      # --- CSS/JS are query-string versioned (see ?v=N in the HTML) so it's safe to cache them for a year ---
      - path: /css/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /js/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
