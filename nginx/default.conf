# Mirrors render.yaml's routing/headers so the Docker deployment behaves the
# same as the Render static site. Keep the two in sync when adding pages.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # --- /free-trial merged into /dang-ky ---
    location ~ ^/free-trial(\.html)?$ {
        return 301 /dang-ky;
    }

    # --- Canonicalize: old *.html URLs 301 to the clean path ---
    location = /index.html {
        return 301 /;
    }
    location ~ ^/(crm|case-study-liam-education|case-study-aztravel|bang-gia|tai-nguyen|lien-he|dang-ky|lms|omni|giai-phap-quan-tri-hop-nhat|giai-phap-ban-hang-khach-hang|giai-phap-kho-chuoi-cung-ung|giai-phap-dao-tao-hoc-tap|giai-phap-tu-dong-hoa-ai-agent|giai-phap-cham-soc-da-kenh|giai-phap-ung-dung-rieng|giai-phap|ve-chung-toi|hrm|ai)\.html$ {
        return 301 /$1;
    }

    # --- English site (/en/): same canonicalization and clean paths ---
    location = /en {
        return 301 /en/;
    }
    location = /en/index.html {
        return 301 /en/;
    }
    location ~ ^/en/(crm|omni|lms|hrm|ai|solutions|unified-management|sales-customer-management|inventory-supply-chain|training-learning|automation-ai-agents|omnichannel-customer-care|custom-applications|pricing|case-study-liam-education|case-study-aztravel|resources|about|contact|sign-up)\.html$ {
        return 301 /en/$1;
    }
    location ~ ^/en/(crm|omni|lms|hrm|ai|solutions|unified-management|sales-customer-management|inventory-supply-chain|training-learning|automation-ai-agents|omnichannel-customer-care|custom-applications|pricing|case-study-liam-education|case-study-aztravel|resources|about|contact|sign-up)$ {
        try_files /en/$1.html =404;
    }
    location = /en/ {
        try_files /en/index.html =404;
    }
    location /en/ {
        try_files $uri =404;
        error_page 404 /en/404.html;
    }

    # --- Serve the clean path from its backing .html file ---
    location ~ ^/(crm|case-study-liam-education|case-study-aztravel|bang-gia|tai-nguyen|lien-he|dang-ky|lms|omni|giai-phap-quan-tri-hop-nhat|giai-phap-ban-hang-khach-hang|giai-phap-kho-chuoi-cung-ung|giai-phap-dao-tao-hoc-tap|giai-phap-tu-dong-hoa-ai-agent|giai-phap-cham-soc-da-kenh|giai-phap-ung-dung-rieng|giai-phap|ve-chung-toi|hrm|ai)$ {
        try_files /$1.html =404;
    }

    # --- CSS/JS are query-string versioned (?v=N in the HTML), safe to cache for a year ---
    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
