# Mirrors render.yaml's routing/headers so the Docker deployment behaves the
# same as the Render static site. Keep the two in sync when adding pages.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate" always;

    # --- Canonicalize: old *.html URLs 301 to the clean path ---
    location = /index.html {
        return 301 /;
    }
    location ~ ^/(crm|case-study-liam-education|case-study-aztravel|bang-gia|tai-nguyen|lien-he|free-trial|dang-ky|lms|omni)\.html$ {
        return 301 /$1;
    }

    # --- Serve the clean path from its backing .html file ---
    location ~ ^/(crm|case-study-liam-education|case-study-aztravel|bang-gia|tai-nguyen|lien-he|free-trial|dang-ky|lms|omni)$ {
        try_files /$1.html =404;
    }

    # --- CSS/JS are query-string versioned (?v=N in the HTML), safe to cache for a year ---
    location ~* \.(?:css|js)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
