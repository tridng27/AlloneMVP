add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://sp.zalo.me; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*.zalo.me https://*.zdn.vn; connect-src 'self' https://api.web3forms.com https://sp.zalo.me; frame-src https://page.widget.zalo.me; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
